      const f = e.target.files && e.target.files[0];
      if (!f) return;
      f.text().then(restore, () => msg("That file couldn't be opened.", true));
      e.target.value = "";
    };
    $("#bk-restore", v).onclick = () => {
      const t = $("#bk-code-in", v).value.trim();
      if (!t) { msg("Paste a backup code first, or choose a backup file.", true); return; }
      restore(t);
    };
  });
}

function modal(html, wire) {
  const v = document.createElement("div");
  v.className = "veil";
  v.innerHTML = `<div class="panel stack" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(v);
  const close = () => v.remove();
  v.addEventListener("click", e => { if (e.target === v || e.target.closest("[data-close]")) close(); });
  wire && wire(v, close);
  const first = v.querySelector("textarea, input, button"); if (first) first.focus();
  return close;
}

function shareGame(g) {
  const code = gameToCode(g);
  modal(`
    <h2>Share “${esc(g.title)}”</h2>
    <p>Copy this code and send it to another phone or tablet (by text or email). There, open Kahallum, tap <b>Add a shared game</b>, and paste it in.</p>
    <textarea id="share-code" class="code-box" readonly rows="5">${esc(code)}</textarea>
    <div class="row" style="justify-content:flex-end">
      <button data-close>Done</button>
      <button class="btn-go" id="copy">📋 Copy code</button>
    </div>`, (v) => {
    const ta = $("#share-code", v);
    $("#copy", v).onclick = () => {
      const fallback = () => { ta.focus(); ta.select(); toast("Code selected: copy it now"); };
      try { navigator.clipboard.writeText(code).then(() => toast("Copied!"), fallback); } catch (e) { fallback(); }
    };
  });
}

function importGame() {
  modal(`
    <h2>Add a shared game</h2>
    <p>Paste the code someone sent you. It starts with <b>KAHALLUM:</b></p>
    <textarea id="imp-code" class="code-box" rows="5" placeholder="KAHALLUM:…"></textarea>
    <p id="imp-msg" class="warn" role="alert" hidden></p>
    <div class="row" style="justify-content:flex-end">
      <button data-close>Cancel</button>
      <button class="btn-go" id="imp-go">Add game</button>
    </div>`, (v, close) => {
    $("#imp-go", v).onclick = () => {
      try {
        const g = codeToGame($("#imp-code", v).value);
        const { added } = addQuizzes([g]);
        close(); toast(added ? "Added “" + g.title + "”" : "You already have “" + g.title + "”"); if (added) render();
      } catch (e) {
        const m = $("#imp-msg", v); m.textContent = "That code didn't work. Check you copied all of it, from KAHALLUM: to the end."; m.hidden = false;
      }
    };
  });
}

function confirmDelete(g) {
  modal(`
    <h2>Delete “${esc(g.title)}”?</h2>
    <p>This game will be gone for good.</p>
    <div class="row" style="justify-content:flex-end">
      <button data-close>Keep it</button>
      <button class="btn-hot" id="del-go">Delete</button>
    </div>`, (v, close) => {
    $("#del-go", v).onclick = () => { store.deleteGame(g.id); close(); toast("Deleted"); render(); };
  });
}

/* ==================================================================
   Events (one listener for the whole app)
   ================================================================== */
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  const qi = el.dataset.q !== undefined ? +el.dataset.q : null;
  const findGame = id => store.games.find(g => g.id === id);

  switch (act) {
    case "home": go("home"); break;
    case "sound": sound.toggle(); el.textContent = sound.on ? "🔊" : "🔇"; sound.tap(); break;
    case "new": go("edit", { isNew: true, game: { id: uid(), title: "", cover: "🎲", questions: [blankQuestion()] } }); break;
    case "edit": { const g = findGame(el.dataset.id); if (g) go("edit", { game: clone(g) }); break; }
    case "play": { const g = findGame(el.dataset.id); if (g) go("setup", { game: g }); break; }
    case "share": { const g = findGame(el.dataset.id); if (g) shareGame(g); break; }
    case "del": { const g = findGame(el.dataset.id); if (g) confirmDelete(g); break; }
    case "import": importGame(); break;
    case "backup": backupModal(); break;

    /* editor */
    case "tick": {
      const q = view.game.questions[qi], a = +el.dataset.a;
      q.correct = q.correct.includes(a) ? q.correct.filter(x => x !== a) : q.correct.concat(a);
      el.classList.toggle("on", q.correct.includes(a));
      el.setAttribute("aria-pressed", q.correct.includes(a));
      sound.tap();
      break;
    }
    case "time": view.game.questions[qi].time = +el.dataset.t; renderEditKeepScroll(); break;
    case "addq": view.game.questions.push(blankQuestion()); renderEdit(); scrollToQ(view.game.questions.length - 1); break;
    case "addtf": view.game.questions.push(blankQuestion("tf")); renderEdit(); scrollToQ(view.game.questions.length - 1); break;
    case "qdel":
      view.game.questions.splice(qi, 1);
      renderEditKeepScroll(); break;
    case "qcopy": view.game.questions.splice(qi + 1, 0, clone(view.game.questions[qi])); renderEdit(); scrollToQ(qi + 1); break;
    case "qup": { const qs = view.game.questions; [qs[qi - 1], qs[qi]] = [qs[qi], qs[qi - 1]]; renderEdit(); scrollToQ(qi - 1); break; }
    case "qdown": { const qs = view.game.questions; [qs[qi + 1], qs[qi]] = [qs[qi], qs[qi + 1]]; renderEdit(); scrollToQ(qi + 1); break; }
    case "pickq":
      openEmoji(qi, em => { view.game.questions[qi].pic = em; el.textContent = em || "➕"; document.querySelector(`[data-pop="${qi}"]`).hidden = true; sound.tap(); });
      break;
    case "pickcover":
      openEmoji("cover", em => { view.game.cover = em; el.textContent = em; document.querySelector('[data-pop="cover"]').hidden = true; sound.tap(); });
      break;
    case "save": saveFromEditor(false); break;
    case "saveplay": saveFromEditor(true); break;

    /* packs */
    case "pickpack": go("packs", { target: view.game, targetIsNew: view.isNew }); break;
    case "openpack":
      if (view.name === "packs") go("pack", { packId: el.dataset.pack, target: view.target, targetIsNew: view.targetIsNew });
      else go("pack", { packId: el.dataset.pack });
      break;
    case "packback":
      if (view.name === "pack" && view.target) go("packs", { target: view.target, targetIsNew: view.targetIsNew });
      else packBack();
      break;
    case "pq": {
      const i = +el.dataset.i;
      view.sel.has(i) ? view.sel.delete(i) : view.sel.add(i);
      const on = view.sel.has(i);
      el.classList.toggle("on", on); el.setAttribute("aria-pressed", on);
      el.querySelector(".box").textContent = on ? "✓" : "";
      sound.tap(); updatePackBar(); break;
    }
    case "pqrandom": {
      const pack = findPack(view.packId);
      view.sel = new Set(shuffle(pack.q.map((_, i) => i)).slice(0, 10));
      sound.tap(); { const y = window.scrollY; renderPack(); window.scrollTo(0, y); } break;
    }
    case "pqall": view.sel = new Set(findPack(view.packId).q.map((_, i) => i)); { const y = window.scrollY; renderPack(); window.scrollTo(0, y); } break;
    case "pqnone": view.sel = new Set(); { const y = window.scrollY; renderPack(); window.scrollTo(0, y); } break;
    case "pqdone": finishPack(); break;
    case "quickplay": {
      const pack = findPack(view.packId);
      const qs = shuffle(pack.q).slice(0, 10).map(packQuestion);
      go("setup", { game: { id: "quick-" + pack.id, title: pack.name, cover: pack.emoji, questions: qs } });
      break;
    }

    /* draw & guess */
    case "dsetup": go("dsetup"); break;
    case "dcat": { const id = el.dataset.id; view.cats.has(id) ? view.cats.delete(id) : view.cats.add(id); sound.tap(); renderKeepScroll(); break; }
    case "dcatall": view.cats = new Set(DRAW_CATS.map(c => c.id)); renderKeepScroll(); break;
    case "dcatnone": view.cats = new Set(); renderKeepScroll(); break;
    case "drounds": view.rounds = +el.dataset.n; renderKeepScroll(); break;
    case "dtime": view.dtime = +el.dataset.t; renderKeepScroll(); break;
    case "dstart": startDraw(); break;
    case "dmode": view.dmode = el.dataset.m; sound.tap(); renderKeepScroll(); break;
    case "dready": view.phase = "guess"; view.tLeft = GUESS_TIME; render(); window.scrollTo(0, 0); break;
    case "dpick": pickGuess(+el.dataset.i); break;
    case "dshow": view.phase = "word"; render(); break;
    case "dnewword": if (view.skips > 0) { view.skips--; view.word = nextWord(); sound.tap(); render(); } break;
    case "dgo": pad.tool = "pen"; pad.color = BLACK; pad.size = SIZES[1]; view.phase = "drawing"; sound.go(); render(); window.scrollTo(0, 0); break;
    case "dpeek": toast(`Your word: ${view.word.w}`); break;
    case "dcol": pad.color = el.dataset.c; if (pad.tool === "eraser") pad.tool = "pen"; updateTools(); break;
    case "dtool": pad.tool = el.dataset.t; updateTools(); break;
    case "dsize": pad.size = +el.dataset.s; updateTools(); break;
    case "dundo": if (view.strokes.length) { view.strokes.pop(); pad.redraw(); } break;
    case "dclear": if (view.strokes.length && view.strokes[view.strokes.length - 1].t !== "clear") { view.strokes.push({ t: "clear" }); pad.redraw(); } break;
    case "dguessed": finishDrawing(); break;
    case "dkeep": view.phase = "drawing"; render(); break;
    case "dwho": scoreDraw(el.dataset.id); view.phase = "reveal"; render(); window.scrollTo(0, 0); break;
    case "dnobody": scoreDraw(null); view.phase = "reveal"; render(); window.scrollTo(0, 0); break;
    case "dscores": view.phase = "board"; render(); window.scrollTo(0, 0); break;
    case "dnext":
      if (view.turn >= view.total - 1) view.phase = "podium";
      else { view.turn++; newTurn(); view.players.forEach(p => p.gained = 0); view.phase = "handoff"; }
      render(); window.scrollTo(0, 0); break;
    case "dagain": startDraw(view.setup); break;
    case "gallery": go("gallery"); break;
    case "wsetup": go("wsetup", { wcat: view.wcat || (view.cat && view.cat.id), wsize: view.wsize || view.size }); break;
    case "wscat": view.wcat = el.dataset.id; sound.tap(); renderKeepScroll(); break;
    case "wssize": view.wsize = el.dataset.k; sound.tap(); renderKeepScroll(); break;
    case "wsstart": startWordSearch(); break;
    case "wsagain": view.wcat = view.cat.id; view.wsize = view.size; startWordSearch(); break;
    case "wshint": wsHint(); break;
    case "gopen": openDrawing(el.dataset.id); break;

    /* setup */
    case "pickav":
      openEmoji("av", em => { if (!em) return; view.newAv = em; el.textContent = em; document.querySelector('[data-pop="av"]').hidden = true; sound.tap(); });
      break;
    case "rmP":
      e.stopPropagation();
      store.family = store.family.filter(p => p.id !== el.dataset.id); store.saveFamily();
      view.selected.delete(el.dataset.id); renderKeepScroll(); break;
    case "toggleP": {
      const id = el.dataset.id;
      view.selected.has(id) ? view.selected.delete(id) : view.selected.add(id);
      view.shuffle = $("#shuf") && $("#shuf").checked;
      sound.tap(); renderKeepScroll(); break;
    }
    case "mode": view.mode = el.dataset.m; view.shuffle = $("#shuf") && $("#shuf").checked; renderSetup(); break;
    case "start": startGame(); break;

    /* play */
    case "quit":
      modal(`<h2>End this game?</h2><p>The scores will be lost.</p>
        <div class="row" style="justify-content:flex-end"><button data-close>Keep playing</button><button class="btn-hot" id="quit-go">End game</button></div>`,
        (v, close) => { $("#quit-go", v).onclick = () => { close(); go("home"); }; });
      break;
    case "ready": view.phase = "question"; renderPlay(); break;
    case "answer": if (view.phase === "question") lockAnswer(+el.dataset.a); break;
    case "nextTurn":
      if (view.turn < view.players.length - 1) { view.turn++; view.phase = "handoff"; }
      else { view.phase = "reveal"; view.scored = false; }
      renderPlay(); break;
    case "revealNow": view.phase = "reveal"; view.revealSound = false; renderPlay(); break;
    case "gotP": {
      const id = el.dataset.id;
      view.got.has(id) ? view.got.delete(id) : view.got.add(id);
      sound.tap();
      el.classList.toggle("got", view.got.has(id));
      el.setAttribute("aria-pressed", view.got.has(id));
      el.lastElementChild.textContent = view.got.has(id) ? "✓" : "";
      break;
    }
    case "toBoard":
      if (view.mode === "host") scoreHost();
      view.phase = "board"; renderPlay(); break;
    case "nextQ":
      if (view.qi < view.questions.length - 1) {
        view.qi++; view.phase = "countin"; view.scored = false; view.revealSound = false;
        view.players.forEach(p => p.gained = 0);
      } else view.phase = "podium";
      renderPlay(); window.scrollTo(0, 0); break;
    case "again": {
      const g = view.game;
      const sel = new Set(view.players.map(p => p.id));
      view = { name: "setup", game: g, mode: view.mode, selected: sel };
      startGame(); break;
    }
  }
});

// Keyboard: Enter/Space on the player toggles in setup.
app.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".player[role=button]")) { e.preventDefault(); e.target.click(); }
});

// Typing in the editor updates the game without re-rendering.
app.addEventListener("input", e => {
  if (view.name !== "edit") return;
  const t = e.target;
  if (t.id === "title") view.game.title = t.value;
  else if (t.classList.contains("q-in")) view.game.questions[+t.dataset.q].text = t.value;
  else if (t.classList.contains("ans-in")) view.game.questions[+t.dataset.q].answers[+t.dataset.a] = t.value;
  const msg = $("#edit-msg"); if (msg) msg.hidden = true;
});

function renderEditKeepScroll() { const y = window.scrollY; renderEdit(); window.scrollTo(0, y); }
function scrollToQ(i) { const el = $("#qe" + i); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); const t = $("#qt" + i); if (t) setTimeout(() => t.focus({ preventScroll: true }), 300); }

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && view.name === "play") keepAwake(true); });

/* ---------- boot ---------- */
sound.init();
store.loadLocal();
gallery.load().then(() => { if (view.name === "home" || view.name === "gallery") renderKeepScroll(); });
render();
store.connect();
</script>
