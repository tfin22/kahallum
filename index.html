<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kahallum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one screen at a time, like a game show. Chunky sticker look:
   thick ink outlines and hard offset shadows on graph-paper blue. */
:root {
  --paper: #e9f0ff;
  --grid: #d4e0fb;
  --card: #ffffff;
  --ink: #1d1b3f;
  --ink-soft: #565a86;
  --coral: #ff6b5e;
  --teal: #22c3a6;
  --sun: #ffc93c;
  --grape: #a98bff;
  --good: #1fae5b;
  --bad: #e2453c;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --line: 3px;
  --pop: 4px 4px 0 var(--ink);
  --radius: 14px;
  color-scheme: light;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--body);
  font-weight: 700;
  font-size: 17px;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 2px, transparent 2px),
    linear-gradient(90deg, var(--grid) 2px, transparent 2px);
  background-size: 34px 34px;
  -webkit-tap-highlight-color: transparent;
}
#app {
  min-height: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .5px; }
h1 { font-size: clamp(2.6rem, 9vw, 4.6rem); line-height: .95; }
h2 { font-size: clamp(1.6rem, 5vw, 2.3rem); }
h3 { font-size: 1.3rem; }
p { margin: 0; }
.muted { color: var(--ink-soft); }

button, .btn {
  font: inherit;
  font-family: var(--display);
  font-size: 1.15rem;
  letter-spacing: .5px;
  color: var(--ink);
  background: var(--card);
  border: var(--line) solid var(--ink);
  border-radius: var(--radius);
  box-shadow: var(--pop);
  padding: 12px 18px;
  cursor: pointer;
  transition: transform .08s, box-shadow .08s;
  touch-action: manipulation;
}
button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 4px solid var(--grape); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
.btn-go { background: var(--sun); }
.btn-good { background: var(--teal); }
.btn-hot { background: var(--coral); color: #fff; }
.btn-small { font-size: .95rem; padding: 7px 12px; box-shadow: 3px 3px 0 var(--ink); border-radius: 11px; }
.btn-big { font-size: 1.5rem; padding: 16px 26px; }
.icon-btn { padding: 6px 10px; font-family: var(--body); font-weight: 900; }

input, textarea, select {
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: var(--line) solid var(--ink);
  border-radius: 12px;
  padding: 11px 13px;
  width: 100%;
  min-width: 0;
}
textarea { resize: vertical; }
label.lbl { font-size: .85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-soft); display: block; margin-bottom: 6px; }

.panel {
  background: var(--card);
  border: var(--line) solid var(--ink);
  border-radius: 20px;
  box-shadow: 6px 6px 0 var(--ink);
  padding: 18px;
}
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.grow { flex: 1 1 auto; min-width: 0; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-size: 1.7rem; display: flex; align-items: center; gap: 8px; cursor: pointer; background: none; border: 0; box-shadow: none; padding: 0; }
.logo:active { transform: none; box-shadow: none; }
.logo .mark { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 30px; height: 30px; }
.logo .mark i { border: 2px solid var(--ink); border-radius: 4px; }
.logo .mark i:nth-child(1) { background: var(--coral); }
.logo .mark i:nth-child(2) { background: var(--teal); }
.logo .mark i:nth-child(3) { background: var(--sun); }
.logo .mark i:nth-child(4) { background: var(--grape); }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; align-items: center; }
.hero .tag { font-size: 1.15rem; max-width: 34ch; }
.hero-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; transform: rotate(-3deg); }
.hero-tiles div { aspect-ratio: 1.5; border: var(--line) solid var(--ink); border-radius: 16px; box-shadow: var(--pop); display: grid; place-items: center; }
.hero-tiles svg { width: 42%; height: auto; }
@media (max-width: 640px) { .hero { grid-template-columns: 1fr; } .hero-tiles { max-width: 300px; } }

.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.game-card { display: flex; flex-direction: column; gap: 10px; }
.game-card .cover { font-size: 3rem; line-height: 1; }
.game-card h3 { font-size: 1.45rem; overflow-wrap: anywhere; }
.game-card .meta { font-size: .9rem; color: var(--ink-soft); }
.game-card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.chip { display: inline-block; font-size: .75rem; text-transform: uppercase; letter-spacing: 1px; background: var(--paper); border: 2px solid var(--ink); border-radius: 99px; padding: 2px 9px; }
.new-card { display: grid; place-items: center; text-align: center; min-height: 190px; border-style: dashed; background: rgba(255,255,255,.6); cursor: pointer; font-family: var(--display); font-size: 1.4rem; }
.new-card .plus { font-size: 3rem; line-height: 1; }

/* ---------- editor ---------- */
.q-list { display: flex; flex-direction: column; gap: 18px; }
.q-edit { display: flex; flex-direction: column; gap: 14px; }
.q-num { font-family: var(--display); background: var(--ink); color: #fff; border-radius: 10px; padding: 4px 11px; font-size: 1.1rem; }
.ans-edit { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .ans-edit { grid-template-columns: 1fr; } }
.ans-box { display: flex; align-items: center; gap: 8px; border: var(--line) solid var(--ink); border-radius: 14px; padding: 8px; }
.ans-box input { border-width: 2px; padding: 9px 10px; }
.ans-box .shape { flex: 0 0 auto; width: 30px; height: 30px; }
.tick { flex: 0 0 auto; width: 46px; height: 46px; padding: 0; font-size: 1.4rem; border-radius: 50%; box-shadow: 2px 2px 0 var(--ink); background: var(--card); color: var(--ink-soft); font-family: var(--body); }
.tick.on { background: var(--good); color: #fff; }
.emoji-btn { font-size: 2rem; width: 64px; height: 64px; padding: 0; display: grid; place-items: center; font-family: var(--body); }
.emoji-pop { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; max-height: 210px; overflow: auto; padding: 8px; border: 2px dashed var(--ink-soft); border-radius: 12px; }
.emoji-pop button { font-size: 1.6rem; padding: 4px; box-shadow: none; border-width: 2px; font-family: var(--body); }
.seg { display: inline-flex; border: var(--line) solid var(--ink); border-radius: 12px; overflow: hidden; box-shadow: 3px 3px 0 var(--ink); }
.seg button { border: 0; border-radius: 0; box-shadow: none; padding: 7px 12px; font-size: .95rem; border-right: 2px solid var(--ink); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--sun); }
.seg button:active { transform: none; }
.sticky-save { position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--paper) 30%); display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }
.warn { color: var(--bad); font-weight: 800; }

/* ---------- question packs ---------- */
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.pack-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 14px; min-height: 120px; border-radius: 18px; }
.pack-tile .em { font-size: 2.4rem; line-height: 1; font-family: var(--body); }
.pack-tile .nm { font-size: 1.3rem; line-height: 1.05; }
.pack-tile .ct { font-family: var(--body); font-size: .85rem; font-weight: 800; margin-top: auto; }
.pq-list { display: flex; flex-direction: column; gap: 8px; }
.pq { display: grid; grid-template-columns: 34px 38px 1fr; align-items: center; gap: 10px; width: 100%; text-align: left; font-family: var(--body); font-size: 1rem; padding: 10px 12px; box-shadow: 3px 3px 0 var(--ink); }
.pq .box { width: 30px; height: 30px; border: var(--line) solid var(--ink); border-radius: 8px; display: grid; place-items: center; font-weight: 900; background: var(--card); }
.pq.on { background: #fff3cc; }
.pq.on .box { background: var(--good); color: #fff; }
.pq .pic { font-size: 1.7rem; line-height: 1; text-align: center; }
.pq .tx { min-width: 0; overflow-wrap: anywhere; font-weight: 800; }
.pq .an { display: block; font-size: .85rem; color: var(--ink-soft); font-weight: 700; margin-top: 2px; }

/* ---------- players ---------- */
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.player { display: flex; align-items: center; gap: 8px; padding: 10px; border: var(--line) solid var(--ink); border-radius: 14px; background: var(--card); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; text-align: left; font-family: var(--body); font-size: 1rem; }
.player.off { opacity: .45; box-shadow: none; }
.player .av { font-size: 1.9rem; line-height: 1; }
.player .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 900; }
.mode-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .mode-pick { grid-template-columns: 1fr; } }
.mode { text-align: left; font-family: var(--body); font-size: 1rem; display: flex; flex-direction: column; gap: 6px; padding: 16px; }
.mode b { font-family: var(--display); font-weight: 400; font-size: 1.4rem; }
.mode.on { background: var(--sun); }

/* ---------- play ---------- */
.stage { display: flex; flex-direction: column; gap: 16px; min-height: calc(100vh - 140px); }
.stage-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.q-card { text-align: center; padding: 22px 18px; }
.q-card .pic { font-size: clamp(3.4rem, 12vw, 6rem); line-height: 1.1; }
.q-card .qt { font-family: var(--display); font-size: clamp(1.7rem, 5.2vw, 3.1rem); line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere; }
.timer { display: flex; align-items: center; gap: 12px; }
.timer .num { font-family: var(--display); font-size: 2.2rem; width: 74px; height: 74px; border-radius: 50%; border: var(--line) solid var(--ink); background: var(--grape); display: grid; place-items: center; box-shadow: var(--pop); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
.timer .num.hurry { background: var(--coral); color: #fff; animation: thump .5s infinite alternate; }
.bar { flex: 1; height: 18px; border: var(--line) solid var(--ink); border-radius: 99px; background: var(--card); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--teal); transform-origin: left; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.answers.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 560px) { .answers { grid-template-columns: 1fr; } }
.answer {
  display: flex; align-items: center; gap: 14px;
  min-height: 92px; padding: 14px 18px;
  font-family: var(--display); font-size: clamp(1.3rem, 3.8vw, 2.1rem); line-height: 1.1; text-align: left;
  border-radius: 18px; box-shadow: 5px 5px 0 var(--ink);
  overflow-wrap: anywhere;
}
.answer .shape { flex: 0 0 auto; width: 46px; height: 46px; }
.answer .txt { flex: 1; min-width: 0; }
.c0 { background: var(--coral); }
.c1 { background: var(--teal); }
.c2 { background: var(--sun); }
.c3 { background: var(--grape); }
.answer.dim { opacity: .28; filter: grayscale(.6); }
.answer.right { outline: 6px solid var(--good); outline-offset: 3px; animation: pop .45s ease-out; }
.answer .who { display: flex; gap: 2px; font-size: 1.6rem; flex-wrap: wrap; justify-content: flex-end; max-width: 45%; }
.answer .mark { font-size: 2rem; }

.center-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding-block: 30px; }
.big-av { font-size: clamp(5rem, 22vw, 9rem); line-height: 1; animation: bob 1.4s ease-in-out infinite alternate; }
.count-in { font-family: var(--display); font-size: clamp(6rem, 30vw, 12rem); line-height: 1; animation: pop .9s ease-out; }

.judge { display: flex; flex-direction: column; gap: 12px; }
.judge .players .player { justify-content: flex-start; }
.player.got { background: var(--good); color: #fff; }

.board { display: flex; flex-direction: column; gap: 10px; }
.board-row { display: grid; grid-template-columns: 40px 50px 1fr auto; align-items: center; gap: 10px; background: var(--card); border: var(--line) solid var(--ink); border-radius: 14px; padding: 8px 14px; box-shadow: 3px 3px 0 var(--ink); animation: slide .4s ease-out both; }
.board-row .rk { font-family: var(--display); font-size: 1.5rem; }
.board-row .av { font-size: 2rem; }
.board-row .nm { font-weight: 900; font-size: 1.15rem; overflow-wrap: anywhere; min-width: 0; }
.board-row .pts { font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.board-row .plus { font-size: .9rem; color: var(--good); font-weight: 900; margin-right: 8px; }
.board-row.lead { background: var(--sun); }
.streak { font-size: .85rem; margin-left: 6px; }

.podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin-top: 20px; }
.pod { display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(30%, 170px); }
.pod .av { font-size: clamp(2.6rem, 10vw, 4.4rem); line-height: 1; }
.pod .nm { font-weight: 900; text-align: center; overflow-wrap: anywhere; }
.pod .blk { width: 100%; border: var(--line) solid var(--ink); border-radius: 14px 14px 0 0; box-shadow: var(--pop); display: grid; place-items: start center; padding-top: 10px; font-family: var(--display); font-size: 2.2rem; animation: rise .8s ease-out both; transform-origin: bottom; }
.pod.p1 .blk { height: 170px; background: var(--sun); animation-delay: .9s; }
.pod.p2 .blk { height: 120px; background: var(--teal); animation-delay: .5s; }
.pod.p3 .blk { height: 85px; background: var(--coral); animation-delay: .1s; }
.pod .pts { font-family: var(--display); font-variant-numeric: tabular-nums; }

/* ---------- modal + toast ---------- */
.veil { position: fixed; inset: 0; background: rgba(29, 27, 63, .55); display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); z-index: 50; }
.veil .panel { width: min(560px, 100%); max-height: 90vh; overflow: auto; }
.code-box { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; font-weight: 600; word-break: break-all; min-height: 120px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 99px; z-index: 60; font-weight: 800; max-width: calc(100% - 32px); text-align: center; animation: slide .25s ease-out; }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; width: 100%; height: 100%; }

@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes thump { to { transform: scale(1.1); } }
@keyframes bob { to { transform: translateY(-12px) rotate(4deg); } }
@keyframes slide { from { opacity: 0; transform: translateY(14px); } }
@keyframes rise { from { transform: scaleY(0); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti" hidden></canvas>
<script>
/* ==================================================================
   Question packs. Each question is:
     [question, picture, rightAnswer, wrong, wrong, wrong]
   or for true/false:
     [statement, picture, true|false]
   Answers get mixed up when they're added to a game.
   ================================================================== */
const PACKS = [
{ id: "animals", name: "Animals", emoji: "🦁", q: [
  ["What is the fastest land animal?", "🐆", "Cheetah", "Lion", "Horse", "Ostrich"],
  ["How many legs does an insect have?", "🐞", "6", "8", "4", "10"],
  ["Which animal is called the King of the Jungle?", "🦁", "Lion", "Tiger", "Gorilla", "Elephant"],
  ["What does a caterpillar turn into?", "🐛", "A butterfly", "A spider", "A bee", "A worm"],
  ["What is a baby cat called?", "🐱", "A kitten", "A puppy", "A cub", "A calf"],
  ["Which of these birds can't fly?", "🐧", "Penguin", "Eagle", "Robin", "Parrot"],
  ["What is the tallest animal in the world?", "🦒", "Giraffe", "Elephant", "Camel", "Horse"],
  ["Which animal has a trunk?", "🐘", "Elephant", "Rhino", "Hippo", "Zebra"],
  ["How many hearts does an octopus have?", "🐙", "3", "1", "2", "8"],
  ["What do pandas mostly eat?", "🐼", "Bamboo", "Fish", "Honey", "Carrots"],
  ["Spiders are insects.", "🕷️", false],
  ["What is a group of wolves called?", "🐺", "A pack", "A herd", "A flock", "A swarm"],
  ["Which animal sleeps hanging upside down?", "🦇", "Bat", "Owl", "Squirrel", "Rabbit"],
  ["What do frogs start life as?", "🐸", "Tadpoles", "Caterpillars", "Chicks", "Puppies"],
  ["A camel keeps water in its hump.", "🐫", false],
  ["What colour is a polar bear's skin?", "🐻‍❄️", "Black", "White", "Pink", "Yellow"],
  ["Which animal can change colour to hide?", "🦎", "Chameleon", "Rabbit", "Goldfish", "Hedgehog"],
  ["Which sea creature has eight arms?", "🐙", "Octopus", "Starfish", "Jellyfish", "Crab"],
  ["Which of these animals is a mammal that can fly?", "🦇", "Bat", "Ostrich", "Dolphin", "Mouse"],
  ["What do bees make?", "🐝", "Honey", "Milk", "Silk", "Jam"],
  ["Dolphins are fish.", "🐬", false],
  ["Which animal has black and white stripes?", "🦓", "Zebra", "Tiger", "Leopard", "Giraffe"],
  ["Where does a mother kangaroo keep her baby?", "🦘", "In a pouch", "In a nest", "In a burrow", "In a shell"],
  ["What is a baby dog called?", "🐶", "A puppy", "A kitten", "A foal", "A lamb"],
  ["Which of these animals moves the slowest?", "🦥", "Sloth", "Cheetah", "Rabbit", "Horse"],
  ["Which animal carries a shell on its back?", "🐢", "Tortoise", "Hedgehog", "Frog", "Lizard"],
  ["When are owls most awake?", "🦉", "At night", "In the morning", "At lunchtime", "At teatime"],
  ["Which is the biggest kind of cat?", "🐯", "Tiger", "Lion", "Cheetah", "Leopard"],
  ["Snakes don't have any legs.", "🐍", true],
  ["What does a herbivore eat?", "🥕", "Only plants", "Only meat", "Plants and meat", "Only fish"],
  ["What is a baby sheep called?", "🐑", "A lamb", "A kid", "A chick", "A piglet"],
  ["What is the largest animal that has ever lived?", "🐳", "Blue whale", "T. rex", "Elephant", "Great white shark"]
]},

{ id: "maths", name: "Maths", emoji: "🔢", q: [
  ["7 + 8 = ?", "➕", "15", "14", "16", "13"],
  ["5 × 3 = ?", "✖️", "15", "8", "12", "18"],
  ["20 − 7 = ?", "➖", "13", "12", "14", "27"],
  ["How many sides does a triangle have?", "🔺", "3", "4", "5", "6"],
  ["How many sides does a hexagon have?", "🐝", "6", "5", "8", "7"],
  ["10 × 10 = ?", "💯", "100", "20", "1000", "110"],
  ["What is half of 18?", "🍕", "9", "8", "6", "36"],
  ["How many minutes are in an hour?", "⏰", "60", "100", "30", "24"],
  ["How many days are in a week?", "📅", "7", "5", "10", "12"],
  ["6 × 4 = ?", "✖️", "24", "20", "28", "10"],
  ["What is double 25?", "✌️", "50", "52", "45", "75"],
  ["100 − 45 = ?", "➖", "55", "65", "45", "50"],
  ["12 ÷ 3 = ?", "➗", "4", "3", "6", "9"],
  ["Which of these numbers is even?", "🔢", "8", "3", "5", "9"],
  ["How many corners does a square have?", "🟥", "4", "3", "5", "8"],
  ["9 + 9 + 9 = ?", "➕", "27", "18", "99", "21"],
  ["How many months are in a year?", "🗓️", "12", "10", "11", "52"],
  ["What comes next? 2, 4, 6, 8, …", "🔢", "10", "9", "12", "11"],
  ["3 × 7 = ?", "✖️", "21", "24", "18", "37"],
  ["What is a quarter of 20?", "🍰", "5", "4", "10", "2"],

/* ==================================================================
   Storage: browser storage always; when this page runs as a Claude
   artifact, games are also kept in the viewer's private database so
   they show up on every device the same person opens it on.
   ================================================================== */
const store = {
  games: [],
  family: [],
  db: null,
  uid: null,
  loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        this.games = Array.isArray(d.games) ? d.games : exampleGames();
        this.family = Array.isArray(d.family) ? d.family : [];
        return;
      }
    } catch (e) { /* storage blocked: use defaults */ }
    this.games = exampleGames();
    this.family = [];
  },
  saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ games: this.games, family: this.family })); } catch (e) { /* ignore */ }
  },
  docFor(id) { return this.db.collection("data/users/" + this.uid).doc(id); },
  async connect() {
    try {
      if (!window.claude || typeof window.claude.use !== "function") return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.db = db; this.uid = id;
      const snap = await Promise.race([
        db.collection("data/users/" + id).get(),
        new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))
      ]);
      let changed = false;
      const remoteIds = new Set();
      for (const d of snap.docs) {
        const v = d.data();
        if (!v) continue;
        if (d.id === "family" && Array.isArray(v.people)) {
          if (!this.family.length) { this.family = v.people; changed = true; }
          continue;
        }
        if (d.id === "deleted" && Array.isArray(v.ids)) {
          const before = this.games.length;
          this.games = this.games.filter(g => !v.ids.includes(g.id));
          if (this.games.length !== before) changed = true;
          this.deleted = v.ids;
          continue;
        }
        if (v.game && v.game.id) {
          remoteIds.add(v.game.id);
          const i = this.games.findIndex(g => g.id === v.game.id);
          if (i < 0) { this.games.push(v.game); changed = true; }
          else if ((v.game.updated || 0) > (this.games[i].updated || 0)) { this.games[i] = v.game; changed = true; }
        }
      }
      // Push up anything only this device knows about.
      for (const g of this.games) if (!g.example && !remoteIds.has(g.id)) this.pushGame(g);
      if (changed) { this.saveLocal(); if (view.name === "home") render(); }
    } catch (e) {
      this.db = null; // keep working from this device's storage
    }
  },
  pushGame(g) {
    if (!this.db || g.example) return;
    this.docFor("g_" + g.id).set({ game: g }).catch(() => {});
  },
  saveGame(g) {
    g.updated = Date.now();
    delete g.example;
    const i = this.games.findIndex(x => x.id === g.id);
    if (i < 0) this.games.unshift(g); else this.games[i] = g;
    this.saveLocal();
    this.pushGame(g);
  },
  deleteGame(id) {
    this.games = this.games.filter(g => g.id !== id);
    this.saveLocal();
    if (this.db) {
      this.docFor("g_" + id).delete().catch(() => {});
      this.deleted = (this.deleted || []).concat(id).slice(-200);
      this.docFor("deleted").set({ ids: this.deleted }).catch(() => {});
    }
  },
  saveFamily() {
    this.saveLocal();
    if (this.db) this.docFor("family").set({ people: this.family }).catch(() => {});
  }
};

/* ==================================================================
   Sounds (made in the browser, no files needed)
   ================================================================== */
const sound = {
  on: true, ctx: null,
  init() {
    try { this.on = localStorage.getItem("kahallum.sound") !== "off"; } catch (e) {}
  },
  toggle() {
    this.on = !this.on;
    try { localStorage.setItem("kahallum.sound", this.on ? "on" : "off"); } catch (e) {}
  },
  beep(freq, dur = .12, type = "square", vol = .06, when = 0) {
    if (!this.on) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const t = this.ctx.currentTime + when;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  },
  tick() { this.beep(880, .05, "square", .03); },
  go() { [523, 659, 784].forEach((f, i) => this.beep(f, .14, "square", .05, i * .09)); },
  yay() { [523, 659, 784, 1047].forEach((f, i) => this.beep(f, .2, "triangle", .08, i * .1)); },
  nope() { this.beep(196, .35, "sawtooth", .05); this.beep(147, .4, "sawtooth", .05, .18); },
  tap() { this.beep(660, .06, "triangle", .05); },
  fanfare() { [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => this.beep(f, .22, "triangle", .08, i * .14)); }
};

/* ---------- screen wake lock during play ---------- */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

function validateGame(g) {
  if (!g.title.trim()) return { msg: "Give your game a name.", focus: "#title" };
  if (!g.questions.length) return { msg: "Add at least one question." };
  for (let i = 0; i < g.questions.length; i++) {
    const q = g.questions[i];
    if (!q.text.trim()) return { msg: `Question ${i + 1} needs some words.`, focus: "#qt" + i };
    const filled = q.answers.map((a, ai) => a.trim() ? ai : -1).filter(x => x >= 0);
    if (filled.length < 2) return { msg: `Question ${i + 1} needs at least 2 answers.`, focus: "#q" + i + "a" + (filled.includes(0) ? 1 : 0) };
    if (!q.correct.some(c => filled.includes(c))) return { msg: `Question ${i + 1}: tap ✓ next to the right answer.`, focus: "#qe" + i };
  }
  return null;
}

function cleanGame(g) {
  const out = clone(g);
  out.title = out.title.trim();
  out.questions = out.questions.map(q => {
    const keep = q.answers.map((a, i) => ({ a: a.trim(), ok: q.correct.includes(i) })).filter(x => x.a);
    return { text: q.text.trim(), pic: q.pic || "", time: q.time || 20, answers: keep.map(x => x.a), correct: keep.map((x, i) => x.ok ? i : -1).filter(i => i >= 0) };
  });
  return out;
}

function saveFromEditor(thenPlay) {
  const g = view.game;
  const problem = validateGame(g);
  const msg = $("#edit-msg");
  if (problem) {
    msg.textContent = problem.msg; msg.hidden = false;
    sound.nope();
    if (problem.focus) { const el = $(problem.focus); if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); if (el.focus) el.focus({ preventScroll: true }); } }
    return;
  }
  const clean = cleanGame(g);
  store.saveGame(clean);
  toast("Saved “" + clean.title + "”");
  if (thenPlay) go("setup", { game: clean }); else go("home");
}

function openEmoji(key, onPick) {

  document.querySelectorAll(".emoji-pop").forEach(p => p.hidden = true);
  pop.innerHTML = (key === "cover" ? "" : `<button data-e="" aria-label="No picture">✕</button>`) +
    EMOJI.map(e => `<button data-e="${e}">${e}</button>`).join("");
  pop.hidden = false;
  pop.onclick = ev => {
    const b = ev.target.closest("button[data-e]");
    if (!b) return;
    onPick(b.dataset.e);
  };
}

  const answers = shuffle([right, ...wrong]);
  return { text, pic, time: 20, answers, correct: [answers.indexOf(right)] };

      <button class="btn-go" data-act="pqdone" id="pq-done" ${view.sel.size ? "" : "disabled"}>${packDoneLabel()}</button>
    </div>`;
}
function packDoneLabel() {
  const n = view.sel.size;
  return view.target ? `Add ${n} to my game ▶` : `Make a game with ${n} ▶`;
}
function updatePackBar() {
  $("#pq-count").textContent = view.sel.size + " picked";
  const b = $("#pq-done"); b.textContent = packDoneLabel(); b.disabled = !view.sel.size;
}
function isBlankQuestion(q) { return !q.text.trim() && !q.answers.some(a => a.trim() && a !== "True" && a !== "False"); }

function finishPack() {
  const pack = findPack(view.packId);
  const picked = [...view.sel].sort((a, b) => a - b).map(i => packQuestion(pack.q[i]));
  if (!picked.length) return;
  if (view.target) {
    const g = view.target;
    g.questions = g.questions.filter(q => !isBlankQuestion(q)).concat(picked);
    toast(`Added ${picked.length} question${picked.length === 1 ? "" : "s"}`);
    go("edit", { game: g, isNew: view.targetIsNew });
  } else {
    go("edit", { isNew: true, game: { id: uid(), title: pack.name + " Quiz", cover: pack.emoji, questions: picked } });
    toast(`${picked.length} questions ready. Change anything you like!`);
  }
}

/* ---------------- SETUP (who's playing) ---------------- */
function renderSetup() {
  const g = view.game;
  view.mode = view.mode || "host";
  if (!view.selected) view.selected = new Set(store.family.map(p => p.id));
  const people = store.family.map(p => `
    <div class="player ${view.selected.has(p.id) ? "" : "off"}" data-act="toggleP" data-id="${esc(p.id)}" role="button" tabindex="0" aria-pressed="${view.selected.has(p.id)}">
      <span class="av">${esc(p.av)}</span><span class="nm">${esc(p.name)}</span>
      <button class="btn-small icon-btn" data-act="rmP" data-id="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">✕</button>
    </div>`).join("");
  const count = store.family.filter(p => view.selected.has(p.id)).length;
  const newAv = view.newAv || AVATARS[store.family.length % AVATARS.length];
  view.newAv = newAv;

  app.innerHTML = `
    ${topbar()}
    <div class="row spread"><h2>${esc(g.cover || "🎲")} ${esc(g.title)}</h2><button class="btn-small" data-act="home">✕ Back</button></div>
    <section class="panel stack">
      <h3>Who's playing?</h3>
      ${store.family.length ? `<div class="players">${people}</div>` : `<p class="muted">Add everyone in the room. Kahallum remembers them for next time.</p>`}
      <form id="addP" class="row" autocomplete="off">
        <button type="button" class="emoji-btn" data-act="pickav" aria-label="Choose a picture for the new player">${esc(newAv)}</button>
        <input id="pname" class="grow" style="width:auto;flex:1 1 160px" maxlength="16" placeholder="Name, like Mum or Grandad">
        <button class="btn-good" type="submit">＋ Add</button>
      </form>
      <div class="emoji-pop" data-pop="av" hidden></div>
    </section>
    <section class="stack">
      <h3>How do you want to play?</h3>
      <div class="mode-pick">
        <button class="mode ${view.mode === "host" ? "on" : ""}" data-act="mode" data-m="host">
          <b>📺 Quizmaster</b>
          <span>Put it on the TV or a laptop. Everyone shouts or points at their answer. The quizmaster taps who got it right.</span>
        </button>
        <button class="mode ${view.mode === "pass" ? "on" : ""}" data-act="mode" data-m="pass">
          <b>📱 Pass the phone</b>
          <span>Everyone takes a turn answering in secret on the same phone or tablet. Faster answers score more points.</span>
        </button>
      </div>
      <label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" id="shuf" style="width:24px;height:24px" ${view.shuffle ? "checked" : ""}> Mix up the question order</label>
    </section>
    <p id="setup-msg" class="warn" role="alert" hidden></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn-go btn-big" data-act="start" ${count ? "" : "disabled"}>Start with ${count} player${count === 1 ? "" : "s"} ▶</button>
    </div>`;

  $("#addP").onsubmit = e => {
    e.preventDefault();
    const name = $("#pname").value.trim();
    if (!name) { $("#pname").focus(); return; }
    const p = { id: uid(), name, av: view.newAv };
    store.family.push(p); store.saveFamily();
    view.selected.add(p.id);
    view.newAv = AVATARS[(AVATARS.indexOf(view.newAv) + 1) % AVATARS.length];
    sound.tap();
    renderSetup();
    $("#pname").focus();
  };
}

/* ---------------- PLAY ---------------- */
/* play state lives on view:
   phase: ready | countin | handoff | question | locked | reveal | board | podium */
function startGame() {
  const g = view.game;
  const players = store.family.filter(p => view.selected.has(p.id)).map(p => ({ ...p, score: 0, gained: 0, streak: 0 }));
  if (!players.length) return;
  let questions = clone(g.questions);
  if ($("#shuf") && $("#shuf").checked) questions = shuffle(questions);
  view = { name: "play", game: g, mode: view.mode, players, questions, qi: 0, phase: "countin", picks: {}, got: new Set(), turn: 0 };
  keepAwake(true);
  renderPlay();
}

function curQ() { return view.questions[view.qi]; }

function playTop() {
  return topbar(`<span class="chip">Q ${view.qi + 1} of ${view.questions.length}</span><button class="btn-small" data-act="quit">✕ End</button>`);
}

function questionCard(q) {
  return `<div class="panel q-card">${q.pic ? `<div class="pic">${esc(q.pic)}</div>` : ""}<div class="qt">${esc(q.text)}</div></div>`;
}

function answerTiles(q, opts = {}) {
  return `<div class="answers ${q.answers.length === 2 ? "two" : ""}">` + q.answers.map((a, i) => {
    let cls = `answer ${COLORS[i]}`;
    if (opts.reveal) cls += q.correct.includes(i) ? " right" : " dim";
    const who = opts.who && opts.who[i] ? `<span class="who">${opts.who[i].map(esc).join("")}</span>` : "";
    const mark = opts.reveal && q.correct.includes(i) ? '<span class="mark">✅</span>' : "";
    return `<button class="${cls}" ${opts.clickable ? `data-act="answer" data-a="${i}"` : 'tabindex="-1"'} aria-label="${SHAPE_NAMES[i]}: ${esc(a)}">${SHAPES[i]}<span class="txt">${esc(a)}</span>${who}${mark}</button>`;
  }).join("") + `</div>`;
}

function timerHTML(q) {
  return `<div class="timer"><div class="num" id="tnum">${q.time}</div><div class="bar"><i id="tbar"></i></div></div>`;
}

function runTimer(seconds, onEnd) {
  stopTimer();
  const start = performance.now();
  view.qStart = start;
  let lastShown = seconds;
  timerHandle = setInterval(() => {
    const left = Math.max(0, seconds - (performance.now() - start) / 1000);
    const shown = Math.ceil(left);
    const num = $("#tnum"), bar = $("#tbar");
    if (num) { num.textContent = shown; num.classList.toggle("hurry", left <= 5); }
    if (bar) bar.style.transform = `scaleX(${left / seconds})`;
    if (shown !== lastShown) { lastShown = shown; if (shown <= 5 && shown > 0) sound.tick(); }
    if (left <= 0) { stopTimer(); onEnd(); }
  }, 100);
}

function renderPlay() {
  const q = curQ();
  const P = view.players;
  stopTimer();

  if (view.phase === "countin") {
    app.innerHTML = `${playTop()}
      <div class="stage"><div class="center-screen">
        <p class="chip">Question ${view.qi + 1}</p>
        <div class="count-in" id="cnt">3</div>
        <h2>Get ready…</h2>
      </div></div>`;
    let n = 3; sound.tick();
    timerHandle = setInterval(() => {
      n--;
      if (n <= 0) {
        stopTimer(); sound.go();
        view.phase = view.mode === "pass" ? "handoff" : "question";
        view.turn = 0; view.picks = {}; view.got = new Set();
        renderPlay();
        return;
      }
      sound.tick();
      const c = $("#cnt"); if (c) { c.textContent = n; c.style.animation = "none"; void c.offsetWidth; c.style.animation = ""; }
    }, 800);
    return;
  }

  if (view.phase === "handoff") {
    const p = P[view.turn];
    app.innerHTML = `${playTop()}
      <div class="stage"><div class="center-screen">
        <p class="muted">Pass the phone to…</p>
        <div class="big-av">${esc(p.av)}</div>
        <h1>${esc(p.name)}</h1>
        <p class="muted">No peeking, everyone else!</p>
        <button class="btn-go btn-big" data-act="ready">I'm ready! ▶</button>
      </div></div>`;
    return;
  }

  if (view.phase === "question") {
    const who = view.mode === "pass" ? P[view.turn] : null;
    app.innerHTML = `${playTop()}
      <div class="stage">
        ${who ? `<div class="row"><span class="chip">${esc(who.av)} ${esc(who.name)}'s turn</span></div>` : ""}
        ${questionCard(q)}
        ${timerHTML(q)}
        ${answerTiles(q, { clickable: view.mode === "pass" })}
        ${view.mode === "host" ? `<div class="row" style="justify-content:flex-end"><button class="btn-go" data-act="revealNow">Show the answer ▶</button></div>` : ""}
      </div>`;
    runTimer(q.time, () => {
      if (view.mode === "pass") lockAnswer(null); else { view.phase = "reveal"; renderPlay(); }
    });
    return;
  }

  if (view.phase === "locked") {
    const p = P[view.turn];
    const last = view.turn === P.length - 1;
    app.innerHTML = `${playTop()}
      <div class="stage"><div class="center-screen">
        <div class="big-av">${esc(p.av)}</div>
        <h2>${view.picks[p.id] && view.picks[p.id].a !== null ? "Answer locked in! 🔒" : "Out of time! ⏰"}</h2>
        <p class="muted">${last ? "Everyone has answered." : "Hide the screen and pass it on."}</p>
        <button class="btn-go btn-big" data-act="nextTurn">${last ? "See the answer ▶" : "Next player ▶"}</button>
      </div></div>`;
    return;
  }

  if (view.phase === "reveal") {
    if (view.mode === "pass") {
      // Score everyone and show who picked what.
      if (!view.scored) {
        view.scored = true;
        P.forEach(p => {
          const pick = view.picks[p.id];
          const right = pick && pick.a !== null && q.correct.includes(pick.a);
          if (right) {
            p.streak++;
            const speed = Math.round(1000 * (1 - (pick.t / q.time) / 2));
            p.gained = speed + Math.min(p.streak - 1, 5) * 100;
          } else { p.streak = 0; p.gained = 0; }
          p.score += p.gained;
        });
        const anyRight = P.some(p => p.gained > 0);
        anyRight ? sound.yay() : sound.nope();
      }
      const who = q.answers.map((_, i) => P.filter(p => view.picks[p.id] && view.picks[p.id].a === i).map(p => p.av));
      const results = P.map(p => `<span class="chip" style="background:${p.gained ? "var(--good)" : "var(--card)"};color:${p.gained ? "#fff" : "var(--ink)"}">${esc(p.av)} ${esc(p.name)} ${p.gained ? "+" + p.gained : "✗"}</span>`).join(" ");
      app.innerHTML = `${playTop()}
        <div class="stage">
          ${questionCard(q)}
          ${answerTiles(q, { reveal: true, who })}
          <div class="row">${results}</div>
          <div class="row" style="justify-content:flex-end"><button class="btn-go btn-big" data-act="toBoard">Scores ▶</button></div>
        </div>`;
      return;
    }
    // Quizmaster: show the answer, then tap who got it right.
    if (!view.revealSound) { view.revealSound = true; sound.yay(); }
    const chips = P.map(p => `
      <button class="player ${view.got.has(p.id) ? "got" : ""}" data-act="gotP" data-id="${esc(p.id)}" aria-pressed="${view.got.has(p.id)}">
        <span class="av">${esc(p.av)}</span><span class="nm">${esc(p.name)}</span><span>${view.got.has(p.id) ? "✓" : ""}</span>
      </button>`).join("");
    app.innerHTML = `${playTop()}
      <div class="stage">
        ${questionCard(q)}
        ${answerTiles(q, { reveal: true })}
        <div class="panel judge">
          <h3>Who got it right? Tap them.</h3>
          <div class="players">${chips}</div>
          <p class="muted">Tap them in the order they answered: first gets the most points.</p>
          <div class="row" style="justify-content:flex-end"><button class="btn-go btn-big" data-act="toBoard">Scores ▶</button></div>
        </div>
      </div>`;
    return;
  }

  if (view.phase === "board") {
    const ranked = P.slice().sort((a, b) => b.score - a.score);
    const last = view.qi === view.questions.length - 1;
    const rows = ranked.map((p, i) => `
      <div class="board-row ${i === 0 && p.score > 0 ? "lead" : ""}" style="animation-delay:${i * .08}s">
        <span class="rk">${i + 1}</span><span class="av">${esc(p.av)}</span>
        <span class="nm">${esc(p.name)}${p.streak > 1 ? `<span class="streak">🔥${p.streak}</span>` : ""}</span>
        <span class="row" style="gap:0">${p.gained ? `<span class="plus">+${p.gained}</span>` : ""}<span class="pts">${p.score}</span></span>
      </div>`).join("");
    app.innerHTML = `${playTop()}
      <div class="stage">
        <h2>Scoreboard</h2>
        <div class="board">${rows}</div>
        <div class="row" style="justify-content:flex-end"><button class="btn-go btn-big" data-act="nextQ">${last ? "And the winner is… 🏆" : "Next question ▶"}</button></div>
      </div>`;
    return;
  }

  if (view.phase === "podium") {
    const ranked = P.slice().sort((a, b) => b.score - a.score);
    const spot = (p, n) => p ? `<div class="pod p${n}"><span class="av">${esc(p.av)}</span><span class="nm">${esc(p.name)}</span><span class="pts">${p.score}</span><div class="blk">${n}</div></div>` : "";
    const rest = ranked.slice(3).map((p, i) => `<div class="board-row"><span class="rk">${i + 4}</span><span class="av">${esc(p.av)}</span><span class="nm">${esc(p.name)}</span><span class="pts">${p.score}</span></div>`).join("");
    app.innerHTML = `${topbar()}
      <div class="stage">
        <div class="center-screen" style="flex:0;padding-bottom:0">
          <p class="chip">${esc(view.game.title)}</p>
          <h1>${esc(ranked[0].name)} wins!</h1>
        </div>
        <div class="podium">${spot(ranked[1], 2)}${spot(ranked[0], 1)}${spot(ranked[2], 3)}</div>
        ${rest ? `<div class="board">${rest}</div>` : ""}
        <div class="row" style="justify-content:center">
          <button class="btn-go btn-big" data-act="again">Play again 🔁</button>
          <button class="btn-big" data-act="home">Home 🏠</button>
        </div>
      </div>`;
    sound.fanfare();
    confetti();
    keepAwake(false);
    return;
  }
}

function lockAnswer(a) {
  stopTimer();
  const q = curQ();
  const p = view.players[view.turn];
  const t = Math.min(q.time, (performance.now() - view.qStart) / 1000);
  view.picks[p.id] = { a, t };
  if (a !== null) sound.tap(); else sound.nope();
  view.phase = "locked";
  renderPlay();
}

function scoreHost() {
  // First tapped earns 1000, each after drops by 100 (never below 500).
  const order = [...view.got];
  view.players.forEach(p => {
    const pos = order.indexOf(p.id);
    if (pos >= 0) { p.streak++; p.gained = Math.max(500, 1000 - pos * 100) + Math.min(p.streak - 1, 5) * 100; }
    else { p.streak = 0; p.gained = 0; }
    p.score += p.gained;
  });
}

/* ---------------- confetti ---------------- */
function confetti() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"); c.hidden = false;
  const ctx = c.getContext("2d");
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#ff6b5e", "#22c3a6", "#ffc93c", "#a98bff", "#1d1b3f"];
  const bits = Array.from({ length: 160 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * .6, r: 5 + Math.random() * 7, vx: -1.5 + Math.random() * 3, vy: 2 + Math.random() * 3.5, a: Math.random() * 6, va: -.2 + Math.random() * .4, c: cols[Math.floor(Math.random() * cols.length)] }));
  const end = performance.now() + 5000;
  (function frame(now) {
    ctx.clearRect(0, 0, W, H);
    bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.a += b.va; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = b.c; ctx.fillRect(-b.r / 2, -b.r / 4, b.r, b.r / 2); ctx.restore(); });
    if (now < end && view.name === "play") requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); c.hidden = true; }
  })(performance.now());
}

/* ==================================================================
   Sharing: a game becomes a short code you can text or copy to
   another phone, tablet or laptop.
   ================================================================== */
function gameToCode(g) {
  const slim = { t: g.title, c: g.cover, q: g.questions.map(q => [q.text, q.pic, q.time, q.answers, q.correct]) };
  const json = JSON.stringify(slim);
  const bytes = new TextEncoder().encode(json);
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  const b64 = btoa(bin);
  return "KAHALLUM:" + b64;
}
function codeToGame(code) {
  const m = String(code).replace(/\s+/g, "").match(/KAHALLUM:([A-Za-z0-9+/=]+)/i);
  if (!m) throw new Error("bad");
  const bytes = Uint8Array.from(atob(m[1]), ch => ch.charCodeAt(0));
  const d = JSON.parse(new TextDecoder().decode(bytes));
  if (!d || !Array.isArray(d.q) || !d.q.length) throw new Error("bad");
  const g = {
    id: uid(), title: String(d.t || "Shared game").slice(0, 50), cover: String(d.c || "🎲").slice(0, 8),
    questions: d.q.slice(0, 100).map(q => {
      const answers = (Array.isArray(q[3]) ? q[3] : []).slice(0, 4).map(a => String(a).slice(0, 80));
      return { text: String(q[0] || "").slice(0, 160), pic: String(q[1] || "").slice(0, 8), time: TIMES.includes(q[2]) ? q[2] : 20, answers, correct: (Array.isArray(q[4]) ? q[4] : []).filter(i => Number.isInteger(i) && i >= 0 && i < answers.length) };
    }).filter(q => q.text && q.answers.length >= 2 && q.correct.length)
  };
  if (!g.questions.length) throw new Error("bad");
  return g;
}

function modal(html, wire) {
  const v = document.createElement("div");
  v.className = "veil";
  v.innerHTML = `<div class="panel stack" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(v);
  const close = () => v.remove();
  v.addEventListener("click", e => { if (e.target === v || e.target.closest("[data-close]")) close(); });
  wire && wire(v, close);
  const first = v.querySelector("textarea, input, button"); if (first) first.focus();
  return close;
}

function shareGame(g) {
  const code = gameToCode(g);
  modal(`
    <h2>Share “${esc(g.title)}”</h2>
    <p>Copy this code and send it to another phone or tablet (by text or email). There, open Kahallum, tap <b>Add a shared game</b>, and paste it in.</p>
    <textarea id="share-code" class="code-box" readonly rows="5">${esc(code)}</textarea>
    <div class="row" style="justify-content:flex-end">
      <button data-close>Done</button>
      <button class="btn-go" id="copy">📋 Copy code</button>
    </div>`, (v) => {
    const ta = $("#share-code", v);
    $("#copy", v).onclick = () => {
      const fallback = () => { ta.focus(); ta.select(); toast("Code selected: copy it now"); };
      try { navigator.clipboard.writeText(code).then(() => toast("Copied!"), fallback); } catch (e) { fallback(); }
    };
  });
}

function importGame() {
  modal(`
    <h2>Add a shared game</h2>
    <p>Paste the code someone sent you. It starts with <b>KAHALLUM:</b></p>
    <textarea id="imp-code" class="code-box" rows="5" placeholder="KAHALLUM:…"></textarea>
    <p id="imp-msg" class="warn" role="alert" hidden></p>
    <div class="row" style="justify-content:flex-end">
      <button data-close>Cancel</button>
      <button class="btn-go" id="imp-go">Add game</button>
    </div>`, (v, close) => {
    $("#imp-go", v).onclick = () => {
      try {
        const g = codeToGame($("#imp-code", v).value);
        store.saveGame(g);
        close(); toast("Added “" + g.title + "”"); render();
      } catch (e) {
        const m = $("#imp-msg", v); m.textContent = "That code didn't work. Check you copied all of it, from KAHALLUM: to the end."; m.hidden = false;
      }
    };
  });
}

function confirmDelete(g) {
  modal(`
    <h2>Delete “${esc(g.title)}”?</h2>
    <p>This game will be gone for good.</p>
    <div class="row" style="justify-content:flex-end">
      <button data-close>Keep it</button>
      <button class="btn-hot" id="del-go">Delete</button>
    </div>`, (v, close) => {
    $("#del-go", v).onclick = () => { store.deleteGame(g.id); close(); toast("Deleted"); render(); };
  });
}

/* ==================================================================
   Events (one listener for the whole app)
   ================================================================== */
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  const qi = el.dataset.q !== undefined ? +el.dataset.q : null;
  const findGame = id => store.games.find(g => g.id === id);

  switch (act) {
    case "home": go("home"); break;
    case "sound": sound.toggle(); el.textContent = sound.on ? "🔊" : "🔇"; sound.tap(); break;
    case "new": go("edit", { isNew: true, game: { id: uid(), title: "", cover: "🎲", questions: [blankQuestion()] } }); break;
    case "edit": { const g = findGame(el.dataset.id); if (g) go("edit", { game: clone(g) }); break; }
    case "play": { const g = findGame(el.dataset.id); if (g) go("setup", { game: g }); break; }
    case "share": { const g = findGame(el.dataset.id); if (g) shareGame(g); break; }
    case "del": { const g = findGame(el.dataset.id); if (g) confirmDelete(g); break; }
    case "import": importGame(); break;

    /* editor */
    case "tick": {
      const q = view.game.questions[qi], a = +el.dataset.a;
      q.correct = q.correct.includes(a) ? q.correct.filter(x => x !== a) : q.correct.concat(a);
      el.classList.toggle("on", q.correct.includes(a));
      el.setAttribute("aria-pressed", q.correct.includes(a));
      sound.tap();
      break;
    }
    case "time": view.game.questions[qi].time = +el.dataset.t; renderEditKeepScroll(); break;
    case "addq": view.game.questions.push(blankQuestion()); renderEdit(); scrollToQ(view.game.questions.length - 1); break;
    case "addtf": view.game.questions.push(blankQuestion("tf")); renderEdit(); scrollToQ(view.game.questions.length - 1); break;
    case "qdel":
      view.game.questions.splice(qi, 1);
      renderEditKeepScroll(); break;
    case "qcopy": view.game.questions.splice(qi + 1, 0, clone(view.game.questions[qi])); renderEdit(); scrollToQ(qi + 1); break;
    case "qup": { const qs = view.game.questions; [qs[qi - 1], qs[qi]] = [qs[qi], qs[qi - 1]]; renderEdit(); scrollToQ(qi - 1); break; }
    case "qdown": { const qs = view.game.questions; [qs[qi + 1], qs[qi]] = [qs[qi], qs[qi + 1]]; renderEdit(); scrollToQ(qi + 1); break; }
    case "pickq":
      openEmoji(qi, em => { view.game.questions[qi].pic = em; el.textContent = em || "➕"; document.querySelector(`[data-pop="${qi}"]`).hidden = true; sound.tap(); });
      break;
    case "pickcover":
      openEmoji("cover", em => { view.game.cover = em; el.textContent = em; document.querySelector('[data-pop="cover"]').hidden = true; sound.tap(); });
      break;
    case "save": saveFromEditor(false); break;
    case "saveplay": saveFromEditor(true); break;

    /* packs */
    case "pickpack": go("packs", { target: view.game, targetIsNew: view.isNew }); break;
    case "openpack":
      if (view.name === "packs") go("pack", { packId: el.dataset.pack, target: view.target, targetIsNew: view.targetIsNew });
      else go("pack", { packId: el.dataset.pack });
      break;
    case "packback":
      if (view.name === "pack" && view.target) go("packs", { target: view.target, targetIsNew: view.targetIsNew });
      else packBack();
      break;
    case "pq": {
      const i = +el.dataset.i;
      view.sel.has(i) ? view.sel.delete(i) : view.sel.add(i);
      const on = view.sel.has(i);
      el.classList.toggle("on", on); el.setAttribute("aria-pressed", on);
      el.querySelector(".box").textContent = on ? "✓" : "";
      sound.tap(); updatePackBar(); break;
    }
    case "pqrandom": {
      const pack = findPack(view.packId);
      view.sel = new Set(shuffle(pack.q.map((_, i) => i)).slice(0, 10));
      sound.tap(); { const y = window.scrollY; renderPack(); window.scrollTo(0, y); } break;
    }
    case "pqall": view.sel = new Set(findPack(view.packId).q.map((_, i) => i)); { const y = window.scrollY; renderPack(); window.scrollTo(0, y); } break;
    case "pqnone": view.sel = new Set(); { const y = window.scrollY; renderPack(); window.scrollTo(0, y); } break;
    case "pqdone": finishPack(); break;
    case "quickplay": {
      const pack = findPack(view.packId);
      const qs = shuffle(pack.q).slice(0, 10).map(packQuestion);
      go("setup", { game: { id: "quick-" + pack.id, title: pack.name, cover: pack.emoji, questions: qs } });
      break;
    }

    /* setup */
    case "pickav":
      openEmoji("av", em => { if (!em) return; view.newAv = em; el.textContent = em; document.querySelector('[data-pop="av"]').hidden = true; sound.tap(); });
      break;
    case "rmP":
      e.stopPropagation();
      store.family = store.family.filter(p => p.id !== el.dataset.id); store.saveFamily();
      view.selected.delete(el.dataset.id); renderSetup(); break;
    case "toggleP": {
      const id = el.dataset.id;
      view.selected.has(id) ? view.selected.delete(id) : view.selected.add(id);
      view.shuffle = $("#shuf") && $("#shuf").checked;
      sound.tap(); renderSetup(); break;
    }
    case "mode": view.mode = el.dataset.m; view.shuffle = $("#shuf") && $("#shuf").checked; renderSetup(); break;
    case "start": startGame(); break;

    /* play */
    case "quit":
      modal(`<h2>End this game?</h2><p>The scores will be lost.</p>
        <div class="row" style="justify-content:flex-end"><button data-close>Keep playing</button><button class="btn-hot" id="quit-go">End game</button></div>`,
        (v, close) => { $("#quit-go", v).onclick = () => { close(); go("home"); }; });
      break;
    case "ready": view.phase = "question"; renderPlay(); break;
    case "answer": if (view.phase === "question") lockAnswer(+el.dataset.a); break;
    case "nextTurn":
      if (view.turn < view.players.length - 1) { view.turn++; view.phase = "handoff"; }
      else { view.phase = "reveal"; view.scored = false; }
      renderPlay(); break;
    case "revealNow": view.phase = "reveal"; view.revealSound = false; renderPlay(); break;
    case "gotP": {
      const id = el.dataset.id;
      view.got.has(id) ? view.got.delete(id) : view.got.add(id);
      sound.tap();
      el.classList.toggle("got", view.got.has(id));
      el.setAttribute("aria-pressed", view.got.has(id));
      el.lastElementChild.textContent = view.got.has(id) ? "✓" : "";
      break;
    }
    case "toBoard":
      if (view.mode === "host") scoreHost();
      view.phase = "board"; renderPlay(); break;
    case "nextQ":
      if (view.qi < view.questions.length - 1) {
        view.qi++; view.phase = "countin"; view.scored = false; view.revealSound = false;
        view.players.forEach(p => p.gained = 0);
      } else view.phase = "podium";
      renderPlay(); window.scrollTo(0, 0); break;
    case "again": {
      const g = view.game;
      const sel = new Set(view.players.map(p => p.id));
      view = { name: "setup", game: g, mode: view.mode, selected: sel };
      startGame(); break;
    }
  }
});

// Keyboard: Enter/Space on the player toggles in setup.
app.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".player[role=button]")) { e.preventDefault(); e.target.click(); }
});

// Typing in the editor updates the game without re-rendering.
app.addEventListener("input", e => {
  if (view.name !== "edit") return;
  const t = e.target;
  if (t.id === "title") view.game.title = t.value;
  else if (t.classList.contains("q-in")) view.game.questions[+t.dataset.q].text = t.value;
  else if (t.classList.contains("ans-in")) view.game.questions[+t.dataset.q].answers[+t.dataset.a] = t.value;
  const msg = $("#edit-msg"); if (msg) msg.hidden = true;
});

function renderEditKeepScroll() { const y = window.scrollY; renderEdit(); window.scrollTo(0, y); }
function scrollToQ(i) { const el = $("#qe" + i); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); const t = $("#qt" + i); if (t) setTimeout(() => t.focus({ preventScroll: true }), 300); }

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && view.name === "play") keepAwake(true); });

/* ---------- boot ---------- */
sound.init();
store.loadLocal();
render();
store.connect();
</script>
</body>
</html>
